name: manual-brief

on:
  workflow_dispatch:        # 필요할 때만 전체 브리핑 수동 실행

permissions:
  contents: write   # sent_history.json 커밋을 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run full briefing
        run: python main.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save sent-history / archive state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "news-bot"
          git config user.email "actions@github.com"
          for f in sent_history.json last_success.json; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d archive ] && git add archive/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sent history [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "sent_history.json 변경 없음, 커밋 생략"
          fi
